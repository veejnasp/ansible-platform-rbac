---
rbac_config:
  organization:
    name: Baggage Services 2
    description: Enterprise organization demo managed via ansible.platform collection

  teams:
    - name: Platform-Engineering
      description: Core platform and infrastructure team
      organization: Baggage Services 2

    - name: Security-Team
      description: Security team
      organization: Baggage Services 2

    - name: Application-DevOps
      description: Application Devops team
      organization: Baggage Services 2

  users:
    - username: aubrey.trotter
      email: aubrey.trotter@aa.com
      first_name: Aubrey
      last_name: Trotter
      password: "{{ rbac_default_password }}"
      teams:
        - Platform-Engineering
        - Security-Team
        - Application-DevOps
      roles:
        - role: Organization Admin
          scope: Baggage Services 2

  team_resource_roles:
    - team: Platform-Engineering
      permissions:
        - resource_name: Demo Job Template
          organization: Default
          role: JobTemplate Execute
