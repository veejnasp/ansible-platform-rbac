---
- name: Ansible RBAC Playbook
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./vars/enterprise-rbac.yml
  vars:
    controller_hostname_raw: >-
      {{
        (aap_hostname | default('', true) | trim)
        or
        (lookup('env', 'CONTROLLER_HOST') | default('', true) | trim)
      }}
    controller_hostname: >-
      {{
        (
          controller_hostname_raw
          if controller_hostname_raw is match('^https?://')
          else 'https://' ~ controller_hostname_raw
        )
        | regex_replace('/+$', '')
      }}
    controller_token: >-
      {{
        (aap_token | default('', true) | trim)
        or
        (lookup('env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) | trim)
      }}
    controller_validate_certs: >-
      {{
        (aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL'), true))
        | default(true)
        | bool
      }}
    rbac_default_password: >-
      {{
        (aap_user_password | default('', true) | trim)
        or
        (lookup('env', 'RBAC_DEFAULT_PASSWORD') | default('', true) | trim)
      }}

  tasks:
    - name: Validate AAP connection settings
      ansible.builtin.assert:
        that:
          - controller_hostname_raw | length > 0
          - controller_hostname is match('^https?://[^/]+$')
          - controller_token | length > 0
        fail_msg: >-
          Provide controller connection values either as env vars
          (CONTROLLER_HOST, CONTROLLER_OAUTH_TOKEN) or as extra vars
          (aap_hostname, aap_token).
          Host must be a hostname or full URL, for example:
          controller.example.com or https://controller.example.com

    - name: Create org
      ansible.platform.organization:
        name: "{{ rbac_config.organization.name }}"
        description: "{{ rbac_config.organization.description }}"
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"

    - name: Create Team
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ rbac_config.organization.name }}"
        description: "{{ item.description }}"
        state: present
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      loop: "{{ rbac_config.teams | default([]) }}"
      register: team_results

    - name: Index teams by name
      ansible.builtin.set_fact:
        rbac_team_ids: >-
          {{
            rbac_team_ids | default({})
            | combine({item.item.name: item.team.id | default(item.id)})
          }}
      loop: "{{ team_results.results | default([]) }}"

    - name: Validate user passwords are provided
      ansible.builtin.assert:
        that:
          - (item.password | default(rbac_default_password, true) | string | trim | length) > 0
        fail_msg: >-
          Password not provided for user {{ item.username }}.
          Set per-user password in vars file, or provide aap_user_password extra var,
          or set RBAC_DEFAULT_PASSWORD environment variable.
      loop: "{{ rbac_config.users | default([]) }}"
      no_log: true

    - name: Create User
      ansible.platform.user:
        username: "{{ item.username }}"
        password: "{{ item.password | default(rbac_default_password, true) }}"
        email: "{{ item.email }}"
        first_name: "{{ item.first_name }}"
        last_name: "{{ item.last_name }}"
        is_superuser: false
        state: present
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      loop: "{{ rbac_config.users | default([]) }}"
      register: users_results
      no_log: true

    - name: Assign User to Team
      ansible.platform.role_user_assignment:
        role_definition: Team Member
        user: "{{ item.0.username }}"
        object_ids:
          - "{{ rbac_team_ids[item.1] }}"
        state: present
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      loop: "{{ rbac_config.users | default([]) | subelements('teams', skip_missing=True) }}"

    - name: Assign Additional Role to User
      ansible.platform.role_user_assignment:
        role_definition: "{{ item.1.role }}"
        user: "{{ item.0.username }}"
        object_ids:
          - "{{ item.1.scope }}"
        state: present
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      loop: "{{ rbac_config.users | default([]) | subelements('roles', skip_missing=True) }}"

    - name: Query job templates by name
      ansible.builtin.uri:
        url: >-
          {{ controller_hostname }}/api/controller/v2/job_templates/
          ?name={{ item.1.resource_name | urlencode }}
          &organization__name={{ rbac_config.organization.name | urlencode }}
        method: GET
        headers:
          Authorization: Bearer {{ controller_token }}
        return_content: true
        validate_certs: "{{ controller_validate_certs }}"
      register: job_template_results
      loop: "{{ rbac_config.team_resource_roles | default([]) | subelements('permissions', skip_missing=True) }}"
      failed_when: false
      no_log: true

    - name: Validate job template lookup
      ansible.builtin.assert:
        that:
          - item.status | default(0) == 200
          - item.json.count | default(0) == 1
          - item.json.results[0].summary_fields.resource.ansible_id is defined
        fail_msg: >-
          Job template lookup failed for {{ item.item.1.resource_name }} in
          organization {{ rbac_config.organization.name }}.
          HTTP status: {{ item.status | default('unknown') }};
          matches: {{ item.json.count | default('unknown') }};
          API message: {{ item.json.detail | default(item.msg) | default('none') }}.
      loop: "{{ job_template_results.results | default([]) }}"

    - name: Index job templates by name
      ansible.builtin.set_fact:
        rbac_job_template_ansible_ids: >-
          {{
            rbac_job_template_ansible_ids | default({})
            | combine({
                item.item.1.resource_name:
                  item.json.results[0].summary_fields.resource.ansible_id
              })
          }}
      loop: "{{ job_template_results.results | default([]) }}"

    - name: Assign team roles on job templates
      ansible.platform.role_team_assignment:
        role_definition: "{{ item.1.role }}"
        team: "{{ rbac_team_ids[item.0.team] }}"
        assignment_objects:
          - object_ansible_id: "{{ rbac_job_template_ansible_ids[item.1.resource_name] }}"
        state: present
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_token }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      loop: "{{ rbac_config.team_resource_roles | default([]) | subelements('permissions', skip_missing=True) }}"
